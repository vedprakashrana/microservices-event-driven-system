# NATS Server Configuration for Microservices Demo

port: 4222
http_port: 8222
server_name: nats-microservices-cluster

# JetStream configuration for guaranteed at-least-once message persistence
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 1GB
}

# Authentication configuration (Token based for secure inter-service messaging)
authorization {
  token: "microservices-secure-nats-token-2026"
  timeout: 5
}

# Logging configuration
logtime: true
debug: false
trace: false
